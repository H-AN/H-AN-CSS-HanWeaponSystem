// HanWeaponSystem 武器配置文件
// 每个武器一个子节点，可设置字段如下：
// command:       执行命令（如 sm_ 开头）
// classname:     给武器的原始 classname
// useclassname:  玩家使用时赋予的 classname
// damage:        可以是 +40 或 x1.5（加法或乘法）
// recoil:        后坐力可选1.0为正常 越高越抖0为无后坐力
// reloadspeed:   换子弹速度带动画修复可选1.0正常越高越慢越低越快
// knowback:      武器击退值
// firespeed:     武器攻速 +1.0:-0.5 可设置左右键
// vmodel/wmodel: 模型路径
// firesound/switchsound: 音效路径
// wmodel_silencer/firesound_silencer: 消音器变体(仅变体武器 weapon_m4a1/weapon_usp 有效); 装上消音器时用变体, 不填回落普通字段
// customsoundct/customsoundt: 替换刀音效路径文件夹 不同队伍
// autofire:      速射连发(1/0) 按住右键强制转左键速射并清除后坐力; 配有机瞄或原生开镜的武器自动失效(机瞄优先)
// Sqtype:        1=手动自定义动画序列(IsCustom2)
// skincode:      皮肤索引
// ammo:          给予弹夹子弹量(默认20000)
// killicon:      击杀图标
// team:          可用队伍(all/ct/t/both等)
// reloadsound:   兜底换弹音效(帧号:路径,逗号分隔; 用HLMV逐帧播放换弹动画, 看第几帧该播哪个音效后回来填; 按reloadfps换算秒(默认30); 自动随reloadspeed对齐)。适用于: 未配空仓/战术的武器所有换弹; 已配单侧空仓/战术的武器另一侧换弹(走引擎普通换弹)
// usedroppedmodel: 1=掉落时使用假W模型 0=直接改世界模型
// armfix:        手臂修复 1=每帧对1号VM执行 m_hWeapon 自赋值修复左手模 0/缺省=不管
// grenadescale:  手雷类武器飞行模型缩放(如 2.0 放大 0.5 缩小; 0/缺省=不缩放; 仅手雷实体生效其他武器无效)
// 机瞄/侧瞄请到 HanWeaponZoomData.cfg 中配置
// 检视请到 HanWeaponInspectData.cfg 中配置
// 奔跑请到 HanWeaponRunData.cfg 中配置
// 空仓/战术换弹请到 HanWeaponEmptyReloadData.cfg 中配置
