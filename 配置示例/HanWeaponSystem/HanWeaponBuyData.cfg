// HanWeaponSystem 武器买卖配置文件
// 此文件与 HanWeaponData.cfg 自动同步：主配置新增武器时会自动追加一个默认键组
// 也可手动添加任意武器段(如卖出原生武器 weapon_usp), 自己填写 useclassname 与价格
// 根字段说明：
// buysystem      买卖系统总开关 1=开启 0=关闭
// buymode        购买时间模式 always=随时随地 buytime=仅购买时间内
// buycommand     购买命令名(默认 sm_buy)
// sellcommand    卖出命令名(默认 sm_sell)
// 武器段字段说明：
// useclassname   对应主配置的武器 useclassname(同步段自动复制; 手动添加的原生武器需自己填)
// name           菜单显示名(空=显示 useclassname)
// buyable        1=可购买 0=关闭(仅对注册表自定义武器生效)
// price          购买价格(空=注册表武器自动回落脚本 WeaponPrice; 原生武器自动回落引擎原生价格)
// sellable       1=可卖出 0=关闭
// sellratio      本队武器卖出比例(默认 0.5=半价)
// sellratio_other 敌方/缴获武器卖出比例(空=回落 sellratio)
"HanWeaponSystem"
{

    "buysystem"       "1"
    "buymode"         "always"
    "buycommand"      "sm_buy"
    "sellcommand"     "sm_sell"

