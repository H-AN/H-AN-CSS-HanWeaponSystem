// HanWeaponSystem 武器检视配置文件
// 此文件与 HanWeaponData.cfg 自动同步：主配置新增武器时会自动追加一个默认键组
// 默认全部关闭检视，需要检视的武器再填写参数
// 字段说明：
// useclassname       对应主配置的武器 useclassname(自动复制)
// inspect            1=启用检视 0=关闭
// inspectseq         检视动作动画序列号
// inspecttime        检视动作时长(帧, 30fps, 与原插件兼容, 如 230=约7.7秒)
// inspectrepeat      0=检视一次播完为止 1=允许反复按F从动画开头重播(好玩向)
// inspectflashlight  0=检视时手电筒正常发光 1=检视时屏蔽手电筒光
// inspectsound       检视音效(可缺省不填=不播放); 多个用英文逗号隔开随机播其中一个; 只自己听得见
// inspectseq_silencer/inspecttime_silencer/inspectsound_silencer: 消音器变体(仅变体武器 m4a1/usp); 装上消音器时生效, 不填回落普通字段
"HanWeaponSystem"
{

    "weapon_TVMissile"
    {
        "useclassname"    "weapon_TVMissile"
        "inspect"         "1"
