// HanWeaponSystem Bot 武器配置文件
// 此文件与 HanWeaponData.cfg 自动同步：主配置新增武器时会自动追加一个默认键组(botchance=0 不给予)
// 根字段说明：
// botsystem      Bot 武器系统总开关 1=开启 0=关闭(默认关闭)
// botmoney       1=金钱模式(按bot当前金钱过滤候选+替换原生武器返差价)
//                0=免费模式(删默认武器直接随机给, 不返还也不扣钱)
// botaimcd       Bot开镜独立CD(秒, 同类行为间冷却, 与奔跑/检视互不饿死)
// botruncd       Bot奔跑独立CD(秒)
// botinspectcd   Bot检视独立CD(秒)
// botaimtime     Bot机瞄/侧瞄开镜维持时长(秒, 到时自动退镜)
// 武器段字段说明：
// useclassname   对应主配置的武器 useclassname(同步段自动复制)
// botchance      Bot随机给予权重 0-100(0=不给予; 权重制: 概率=该值/候选总和, 多个100=均分)
// botaim         Bot使用机瞄/侧瞄几率 0-100(0=禁用; 开火时掷骰, 机瞄/侧瞄合并一个几率随机选一)
// botrun         Bot奔跑几率 0-100(0=禁用; 按住前进时掷骰, 跑或不跑)
// botinspect     Bot检视几率 0-100(0=禁用; 空闲时掷骰)
// 行为判定链: 先查武器本身是否有该功能, 再查本配置允许且几率>0, 最后掷骰+同类行为独立CD
// 槽位判定: 读注册表武器脚本 bucket(0主/1副/2刀/3雷/4C4), 脚本无 bucket 的武器不参与bot给予
