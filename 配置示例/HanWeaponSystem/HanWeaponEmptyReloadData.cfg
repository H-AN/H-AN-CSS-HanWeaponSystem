// HanWeaponSystem 武器空仓/战术换弹配置文件
// 此文件与 HanWeaponData.cfg 自动同步：主配置新增武器时会自动追加一个默认键组
// 默认全部关闭换弹动画，需要换弹动画的武器再填写参数
// 字段说明：
// useclassname     对应主配置的武器 useclassname(自动复制)
// emptyreload      1=启用空仓换弹 0=关闭
// emptyreloadseq   空仓换弹动画序列号(弹匣打空时)
// emptyreloadseq_silencer  空仓换弹·消音器变体序列号(仅变体武器 m4a1/usp; 装上消音器时生效, 不填回落普通字段)
// emptyreloadtime  空仓换弹动画时长(帧, 按fps换算秒)
// emptyreloadtime_silencer 空仓换弹·消音器变体时长(帧)
// emptyreloadsound 空仓换弹音效(帧号:路径,逗号分隔; 用HLMV逐帧播放空仓换弹动画, 看第几帧该播哪个音效后回来填; 按reloadfps换算秒; 自动随reloadspeed对齐; 不填则不播)
// emptyreloadsound_silencer 空仓换弹·消音器变体音效(格式同上)
// reloadfps        换弹动画帧率(默认30, 动画帧率不同的武器按需改24等)
// tacticalreload   1=启用战术换弹 0=关闭
// reloadseq        战术换弹动画序列号(弹匣还有子弹时)
// reloadseq_silencer  战术换弹·消音器变体序列号(仅变体武器 m4a1/usp; 装上消音器时生效, 不填回落普通字段)
// reloadtime       战术换弹动画时长(帧, 按fps换算秒)
// reloadtime_silencer  战术换弹·消音器变体时长(帧)
// tacticalreloadsound 战术换弹音效(帧号:路径,逗号分隔; 用HLMV逐帧播放战术换弹动画, 看第几帧该播哪个音效后回来填; 按reloadfps换算秒; 自动随reloadspeed对齐; 不填则不播)
