// HanWeaponSystem 资源下载配置文件
// 用法: 每行一个路径, // 开头为注释, 反斜杠 \ 会自动转换为 /
// 1) 填目录(无后缀): 递归扫描该目录, 自动下载以下后缀的文件: vtf vmt vtx mdl vvd phy wav mp3
//    例: sound/weapons/axe
// 2) 填单个文件(带后缀): 精确下载该文件
//    例: sound/weapons/axe/axe_break.wav
// 本地测试或没有下载站时: 全部留空, 插件不做任何下载
//
// 默认必需资源(插件机瞄材质, 仓库已附带, 建议保留)
materials/zoom/zoomin.vmt
materials/zoom/zoomin.vtf

