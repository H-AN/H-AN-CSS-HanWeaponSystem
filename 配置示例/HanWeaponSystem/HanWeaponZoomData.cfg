// HanWeaponSystem 机瞄/侧瞄配置文件
// 此文件与 HanWeaponData.cfg 自动同步：主配置新增武器时会自动追加一个默认键组
// 普通武器保持 zoom 0 即可，右键无任何效果；做了机瞄模型的武器再开启并填写参数
// 字段说明：
// useclassname   对应主配置的武器 useclassname(自动复制)
// zoom           1=启用机瞄 0=关闭
// zoommodel      机瞄时 VM 显示的模型(完整路径)
// zoomanimmove   开镜衔接动画序列号(-1=无衔接直接换模型)
// zoomanimtime   衔接动画时长(秒)
// zoomanimfire   1=机瞄时不强制同步开火动画
// zoomfov        镜内放大 FOV(<90 启用镜内放大, 需机瞄模型带 _rt_camera 镜片材质)
// zoomaccuracy   机瞄射击精度 m_fAccuracyPenalty(0.015为原版, -1=不修改)
// zoomspeed      机瞄时移动速度系数(1.0=不减速)
// zoomcrosshair  1=机瞄时隐藏准心 0=不隐藏
// zoompunch      机瞄时屏幕震动系数(0.5=减半, 1.0=不变)
// zoomskinadd    不开镜内放大时的镜片皮肤索引增量(防镜片黑屏, 0=不使用)
//
// 侧瞄参数(与机瞄完全平行的独立一套, 全部 sideaim 前缀, 中键 IN_ATTACK3 触发):
// sideaim         1=启用侧瞄 0=关闭(开启但未填模型也无效)
// sideaimmodel    侧瞄时 VM 显示的模型(完整路径)
// sideaimanimmove 进入侧瞄衔接动画序列号(-1=无衔接直接换模型)
// sideaimanimtime 衔接动画时长(秒)
// sideaimanimfire 1=侧瞄时不强制同步开火动画
// sideaimfov      侧瞄镜内放大 FOV(<90 启用)
// sideaimaccuracy 侧瞄射击精度
// sideaimspeed    侧瞄时移动速度系数
// sideaimcrosshair 1=侧瞄时隐藏准心 0=不隐藏
// sideaimpunch    侧瞄时屏幕震动系数
// sideaimskinadd  侧瞄镜片皮肤索引增量
//
// 消音器变体(仅变体武器 m4a1/usp; 装上消音器时生效, 不填回落普通字段):
// zoommodel_silencer/zoomanimmove_silencer/zoomanimtime_silencer/zoomanimfire_silencer
// sideaimmodel_silencer/sideaimanimmove_silencer/sideaimanimtime_silencer/sideaimanimfire_silencer
